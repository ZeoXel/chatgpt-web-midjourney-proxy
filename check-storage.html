<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage检查工具</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .item { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .large { background: #fee; }
        .btn { padding: 10px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>LocalStorage使用情况</h1>
    <button class="btn" onclick="analyze()">分析存储</button>
    <button class="btn" onclick="clearAssets()">清理资产缓存</button>
    <button class="btn" onclick="clearChat()">压缩聊天记录</button>
    <div id="output"></div>
    
    <script>
    function analyze() {
        let total = 0;
        let items = [];
        
        for (let key in localStorage) {
            if (!localStorage.hasOwnProperty(key)) continue;
            const value = localStorage[key];
            const size = new Blob([value]).size;
            total += size;
            items.push({ key, size });
        }
        
        items.sort((a, b) => b.size - a.size);
        
        let html = `<h2>总使用: ${(total/1024/1024).toFixed(2)}MB / 10MB (${((total/10485760)*100).toFixed(1)}%)</h2>`;
        
        items.forEach(item => {
            const mb = (item.size/1024).toFixed(2);
            const large = item.size > 500000 ? 'large' : '';
            html += `<div class="item ${large}">
                <strong>${item.key}</strong>: ${mb}KB
                ${item.size > 100000 ? '<button onclick="viewItem(\''+item.key+'\')">查看</button>' : ''}
                <button onclick="deleteItem('\''+item.key+'\')">删除</button>
            </div>`;
        });
        
        document.getElementById('output').innerHTML = html;
    }
    
    function viewItem(key) {
        const value = localStorage[key];
        try {
            const parsed = JSON.parse(value);
            console.log(`=== ${key} ===`);
            
            if (parsed.data && parsed.data.chat) {
                console.log('对话数量:', parsed.data.history?.length || 0);
                parsed.data.history?.forEach((h, i) => {
                    const chatData = parsed.data.chat[i]?.data || [];
                    console.log(`  ${i+1}. UUID=${h.uuid}, 消息数=${chatData.length}, 标题="${h.title}"`);
                    
                    // 计算消息大小
                    const chatSize = new Blob([JSON.stringify(chatData)]).size;
                    console.log(`     消息总大小: ${(chatSize/1024).toFixed(2)}KB`);
                });
            } else {
                console.log(parsed);
            }
        } catch (e) {
            console.log('原始值:', value.substring(0, 500));
        }
    }
    
    function deleteItem(key) {
        if (confirm(`确定删除 ${key}?`)) {
            localStorage.removeItem(key);
            analyze();
        }
    }
    
    function clearAssets() {
        ['mjDrawStore', 'sunoStore', 'lumaStore', 'viduStore',
         'modelStore', 'galleryData', 'audioHistory', 'videoHistory',
         'cos-cache-mj-images', 'cos-cache-images', 'cos-cache-music',
         'cos-cache-videos', 'cos-cache-models'].forEach(key => {
            localStorage.removeItem(key);
        });
        alert('资产缓存已清理');
        analyze();
    }
    
    function clearChat() {
        const key = 'chatStorage';
        const raw = localStorage.getItem(key);
        if (!raw) {
            alert('没有找到聊天记录');
            return;
        }
        
        try {
            const parsed = JSON.parse(raw);
            const original = parsed.data.history?.length || 0;
            
            // 只保留最近2条对话
            if (parsed.data && parsed.data.history) {
                parsed.data.history = parsed.data.history.slice(-2);
                parsed.data.chat = parsed.data.chat.slice(-2);
                
                // 限制每条对话的消息数
                parsed.data.chat = parsed.data.chat.map(c => ({
                    ...c,
                    data: c.data.slice(-50)  // 每条对话最多50条消息
                }));
            }
            
            localStorage.setItem(key, JSON.stringify(parsed));
            alert(`已压缩: ${original} → ${parsed.data.history.length} 条对话`);
            analyze();
        } catch (e) {
            alert('压缩失败: ' + e.message);
        }
    }
    
    // 自动分析
    analyze();
    </script>
</body>
</html>
